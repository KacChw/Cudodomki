<!-- FIREBASE SDK (Modular v10+) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    getDocs, 
    doc, 
    deleteDoc, 
    updateDoc,
    query, 
    orderBy 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Konfiguracja pobrana z Twojego script.js
  const firebaseConfig = {
    apiKey: "AIzaSyAO6W4-rLOYqVyrcHdbKlMd6BZAAqYDWQI",
    authDomain: "cudodomki.firebaseapp.com",
    projectId: "cudodomki",
    storageBucket: "cudodomki.firebasestorage.app",
    messagingSenderId: "854596007648",
    appId: "1:854596007648:web:5c62f53622f81e78814285"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginView = document.getElementById('login-view');
  const adminView = document.getElementById('admin-view');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const logoutBtn = document.getElementById('logout-btn');
  const reservationsTable = document.getElementById('reservations-table');
  const reservationsList = document.getElementById('reservations-list');
  const loadingEl = document.getElementById('loading');
  const emptyMsg = document.getElementById('empty-msg');

  // Kontrola logowania
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginView.classList.add('hidden');
      adminView.classList.remove('hidden');
      pobierzRezerwacje();
    } else {
      loginView.classList.remove('hidden');
      adminView.classList.add('hidden');
    }
  });

  // Obsługa logowania
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.style.display = 'none';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      console.error("Błąd logowania:", error);
      loginError.style.display = 'block';
    }
  });

  // Wylogowanie
  logoutBtn.addEventListener('click', () => signOut(auth));

  // Pobieranie rezerwacji z bazy
  async function pobierzRezerwacje() {
    loadingEl.classList.remove('hidden');
    reservationsTable.classList.add('hidden');
    emptyMsg.classList.add('hidden');
    reservationsList.innerHTML = '';

    try {
      // Sortujemy po 'startDate' z Twojego formularza
      const q = query(collection(db, "bookings"), orderBy("startDate", "desc"));
      const querySnapshot = await getDocs(q);

      loadingEl.classList.add('hidden');

      if (querySnapshot.empty) {
        emptyMsg.classList.remove('hidden');
        return;
      }

      reservationsTable.classList.remove('hidden');

      querySnapshot.forEach((docSnap) => {
        const r = docSnap.data();
        const docId = docSnap.id;

        const isApproved = r.status === 'approved';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${escapeHtml(r.cabin || 'Brak')}</strong> (osób: ${escapeHtml(r.guests || '1')})</td>
          <td><a href="mailto:${escapeHtml(r.email || '')}">${escapeHtml(r.email || 'Brak')}</a></td>
          <td>${escapeHtml(r.startDate || 'Brak')}</td>
          <td>${escapeHtml(r.endDate || 'Brak')}</td>
          <td>
            <span class="badge" style="background-color: ${isApproved ? '#e8f8f5' : '#fef9e7'}; color: ${isApproved ? '#1abc9c' : '#f39c12'};">
              ${isApproved ? 'Zatwierdzona' : 'Oczekuje'}
            </span>
          </td>
          <td>
            ${!isApproved ? <button class="btn btn-approve" data-id="${docId}" style="background-color:#2ecc71; padding: 6px 12px; font-size: 0.85em; width: auto; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px;">Zatwierdź</button> : ''}
            <button class="btn btn-delete" data-id="${docId}">Usuń</button>
          </td>
        `;
        reservationsList.appendChild(tr);
      });

      // Obsługa przycisku zatwierdzania (zmienia status na 'approved', co pokaże termin w kalendarzu!)
      document.querySelectorAll('.btn-approve').forEach(button => {
        button.addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          await updateDoc(doc(db, "bookings", id), { status: "approved" });
          pobierzRezerwacje();
        });
      });

      // Obsługa przycisku usuwania
      document.querySelectorAll('.btn-delete').forEach(button => {
        button.addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          if (confirm("Czy na pewno chcesz usunąć tę rezerwację?")) {
            await deleteDoc(doc(db, "bookings", id));
            pobierzRezerwacje();
          }
        });
      });

    } catch (error) {
      console.error("Błąd podczas pobierania rezerwacji:", error);
      loadingEl.textContent = "Błąd pobierania danych. Upewnij się, że jesteś zalogowany.";
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }
</script>
